server {
  listen 80;
  # Dedicated local integration fixture for verifying request transformations.
  location /__inspect/ {
    default_type text/plain;
    return 200 'method=$request_method\nuri=$uri\nargs=$args\nhost=$host\nset=$http_x_console_set\nadd=$http_x_console_add\nremove=$http_x_console_remove\n';
  }
  location / {
    default_type application/json;
    return 200 '{"service":"dashboard-sandbox","message":"APISIX route is working"}';
  }
}
