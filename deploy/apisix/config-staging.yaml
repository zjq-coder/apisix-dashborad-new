apisix:
  node_listen: 9080
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: dashboard-staging
        key: "${{APISIX_ADMIN_KEY}}"
        role: admin
  etcd:
    host:
      - http://staging-etcd:2379
    prefix: /apisix
    timeout: 10
