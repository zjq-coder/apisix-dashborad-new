name: apisix-dashboard-staging
services:
  staging-etcd:
    image: quay.io/coreos/etcd:v3.5.21
    environment:
      ETCD_NAME: staging
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://staging-etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://staging-etcd:2380
      ETCD_INITIAL_CLUSTER: staging=http://staging-etcd:2380
    volumes: ["staging-etcd:/etcd-data"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  apisix-staging:
    build:
      context: ./deploy/apisix/healthcheck
      args:
        APISIX_IMAGE: ${APISIX_IMAGE:-apache/apisix:3.19.0-debian}
    env_file: .local/staging.env
    ports: ["127.0.0.1:29080:9080"]
    volumes:
      - ./deploy/apisix/config-staging.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks: [default, dashboard]
    depends_on:
      staging-etcd: { condition: service_healthy }
    restart: unless-stopped
  echo-staging:
    image: nginx:latest
    volumes: ["./deploy/echo-staging.conf:/etc/nginx/conf.d/default.conf:ro"]
    restart: unless-stopped
volumes:
  staging-etcd:
networks:
  dashboard:
    external: true
    name: apisix-dashboard-next_default
