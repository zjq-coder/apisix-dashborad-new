name: apisix-dashboard-next
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init-dev.ps1}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["dashboard-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  dashboard:
    build: .
    environment:
      DATABASE_URL: postgres://dashboard:${POSTGRES_PASSWORD}@db:5432/dashboard?sslmode=disable
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Generate .env}
      DASHBOARD_ENCRYPTION_KEY: ${DASHBOARD_ENCRYPTION_KEY:?Generate .env}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    profiles: ["gateway"]
    environment:
      ETCD_NAME: sandbox
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: sandbox=http://etcd:2380
    volumes: ["sandbox-etcd:/etcd-data"]
  apisix:
    build:
      context: ./deploy/apisix/healthcheck
      args:
        APISIX_IMAGE: ${APISIX_IMAGE:-apache/apisix:3.19.0-debian}
    profiles: ["gateway"]
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?Generate .env}
    ports: ["127.0.0.1:19180:9180", "127.0.0.1:19080:9080"]
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on: ["etcd"]
  echo:
    image: nginx:latest
    profiles: ["gateway"]
    volumes: ["./deploy/echo.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes:
  dashboard-db:
  sandbox-etcd:
