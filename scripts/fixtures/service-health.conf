log_format fixture '$msec $request_uri $status $http_x_service_health_probe';
server {
  listen 80;
  access_log /dev/stdout fixture;
  default_type text/plain;
  add_header X-Test-Node $hostname always;

  location ~ ^/ready-(active|passive|passive-mismatch)$ {
    if (-f /tmp/readiness-unavailable) { return 503 "not ready"; }
    return 200 "ready";
  }
  location / {
    if (-f /tmp/service-health-fault) { return 503 "$hostname"; }
    return 200 "$hostname";
  }
}
